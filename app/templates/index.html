<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .note-form {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .note-form input,
        .note-form textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        .note-form button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .note-form button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .notes-list {
            display: grid;
            gap: 1rem;
        }

        .note-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .note-card:hover {
            transform: scale(1.02);
        }

        .note-card h3 {
            margin: 0 0 0.5rem 0;
            color: #818cf8;
        }

        .note-card p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .delete-form {
            position: absolute;
            top: 1rem;
            right: 1rem;
            margin: 0;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 0.875rem;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My Notes V1</h1>

        <form class="note-form" action="/add" method="post">
            <input type="text" name="title" placeholder="Note Title" required>
            <textarea name="content" placeholder="Write your note here..." rows="4" required></textarea>
            <button type="submit">Add Note</button>
        </form>

        <div class="notes-list">
            {% for note in notes %}
            <div class="note-card">
                <form action="/delete/{{ note.id }}" method="post" class="delete-form">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
                <h3>{{ note.title }}</h3>
                <p>{{ note.content }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
